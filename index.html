<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scorekeeping</title>
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;
  --text:#e6e8ec;--dim:#8b93a3;--accent:#4f8cff;--accent-soft:#4f8cff22;--red:#e5534b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0}
header a{color:var(--accent);text-decoration:none;font-size:13px}
main{max-width:720px;margin:0 auto;padding:4% 4% 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.sub{color:var(--dim);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

.scorecard{display:grid;grid-template-columns:38% 24% 38%;gap:2%;align-items:center;text-align:center}
.team{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;letter-spacing:.08em;font-size:15px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
.score{font-size:clamp(40px,16vw,64px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.mid{min-width:0}
.mid select{width:100%;text-align:center;padding:8px 4px}

button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.ghost{background:none}
button.danger{color:var(--red)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.goal{width:100%;padding:6% 2%;font-size:clamp(16px,4.8vw,18px);font-weight:700;text-transform:uppercase;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.goal small{font-weight:400;color:var(--dim);font-size:12px}

ol{list-style:none;padding:0;margin:8px 0 0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
li .q{color:var(--dim);width:36%}
li .who{flex:1}
li button{padding:2px 8px;font-size:12px}
.empty{color:var(--dim);padding:8px 0}

label{display:block;margin-bottom:10px}
label span{display:block;color:var(--dim);font-size:12px;margin-bottom:4px}
input,select{width:100%;padding:9px 10px;font-size:16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);outline:none}
input:focus,select:focus{border-color:var(--accent)}
input.code{text-transform:uppercase;letter-spacing:.2em;max-width:140px}
h2{font-size:15px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--red);min-height:1.2em;font-size:13px;margin:4px 0 0}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:5%;width:92%;max-width:360px}
dialog::backdrop{background:#000a}
.hidden,[hidden]{display:none!important}

@media (max-width:480px){
  .grid2{grid-template-columns:1fr}
  .team{font-size:13px;letter-spacing:.04em}
}
</style>
</head>
<body>

<header>
  <h1>Scorekeeping</h1>
  <a id="nav" href="#settings">Settings</a>
</header>

<main>
  <!-- Game view -->
  <section id="game">
    <div class="card">
      <div class="scorecard">
        <div>
          <div class="team"><span class="dot" id="l-dot"></span><span id="l-code">LEFT</span></div>
          <div class="score" id="l-score">0</div>
        </div>
        <div class="mid">
          <label style="margin:0"><span>Quarter</span>
            <select id="quarter"></select></label>
        </div>
        <div>
          <div class="team"><span class="dot" id="r-dot"></span><span id="r-code">RIGHT</span></div>
          <div class="score" id="r-score">0</div>
        </div>
      </div>
    </div>

    <div class="goals">
      <button class="goal" id="l-goal"></button>
      <button class="goal" id="r-goal"></button>
    </div>

    <div class="card">
      <div class="sub">Scorers</div>
      <div id="scorers" style="margin-top:6px"></div>
    </div>

    <div class="card">
      <div class="row between">
        <strong>Goals</strong>
        <button id="undo" class="ghost" disabled>Undo last</button>
      </div>
      <ol id="log"></ol>
    </div>

    <div style="text-align:right">
      <button id="new-game" class="danger">New game</button>
    </div>
  </section>

  <!-- Settings view -->
  <section id="settings-view" hidden>
    <form id="settings-form">
      <div class="card">
        <h2>Teams</h2>
        <div class="grid2">
          <div>
            <div class="sub" style="margin-bottom:8px">Left side</div>
            <label><span>Country code (3 characters)</span>
              <input class="code" id="s-l-code" maxlength="3" required pattern="[A-Za-z0-9]{3}" autocomplete="off"></label>
            <label><span>Team name</span>
              <input id="s-l-name" maxlength="30" autocomplete="off"></label>
            <label><span>Colour</span>
              <input id="s-l-colour" maxlength="20" required autocomplete="off" placeholder="Black"></label>
          </div>
          <div>
            <div class="sub" style="margin-bottom:8px">Right side</div>
            <label><span>Country code (3 characters)</span>
              <input class="code" id="s-r-code" maxlength="3" required pattern="[A-Za-z0-9]{3}" autocomplete="off"></label>
            <label><span>Team name</span>
              <input id="s-r-name" maxlength="30" autocomplete="off"></label>
            <label><span>Colour</span>
              <input id="s-r-colour" maxlength="20" required autocomplete="off" placeholder="White"></label>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Game</h2>
        <label><span>Minutes per quarter</span>
          <input id="s-quarter" type="number" min="1" max="30" required style="max-width:140px"></label>
      </div>

      <div class="row">
        <button type="submit" class="primary">Save</button>
        <a href="#" style="color:var(--dim);font-size:13px">Back to game</a>
      </div>
      <p class="err" id="s-error"></p>
    </form>

    <div class="card" style="margin-top:14px">
      <h2>Reset</h2>
      <p class="sub">Clears all goals and resets the quarter to 1. Team settings are kept.</p>
      <button id="reset-all" class="danger">Clear game</button>
    </div>
  </section>
</main>

<!-- Goal entry -->
<dialog id="goal-dialog">
  <form id="goal-form" method="dialog" novalidate>
    <h2 id="g-title">Goal</h2>
    <div class="grid2">
      <label><span>Player number (2 digits)</span>
        <input id="g-number" inputmode="numeric" maxlength="2" placeholder="02" autocomplete="off"></label>
      <label><span>Scoreboard time (mss)</span>
        <input id="g-time" inputmode="numeric" maxlength="3" placeholder="432" autocomplete="off">
        <span id="g-time-preview" class="sub"></span></label>
    </div>
    <p class="sub" id="g-quarter-note"></p>
    <p class="err" id="g-error"></p>
    <div class="row" style="justify-content:flex-end">
      <button type="button" id="g-cancel" class="ghost">Cancel</button>
      <button type="submit" class="primary">Save goal</button>
    </div>
  </form>
</dialog>

<script>
const KEY = 'scorekeeping.v1';
const DEFAULTS = {
  quarterMinutes: 8,
  quarter: 1,
  teams: {
    left:  { code: 'HOM', name: '', colour: 'Black' },
    right: { code: 'AWY', name: '', colour: 'White' }
  },
  goals: []
};
const QUARTERS = 6;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- storage (browser only, wrapped so a blocked store never breaks the page) ----------
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.teams) return { ...structuredClone(DEFAULTS), ...s };
  } catch (e) {}
  return structuredClone(DEFAULTS);
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
let state = load();

// ---------- time helpers (time is typed in from the physical scoreboard) ----------
const quarterLen = () => state.quarterMinutes * 60;
const mmss = s => {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};
// Goal time is typed as three digits, mss: "432" = 4:32. Returns seconds, or null if invalid.
function goalTimeSecs(digits) {
  if (!/^\d{3}$/.test(digits)) return null;
  const m = +digits[0];
  const s = +digits.slice(1);
  if (s > 59) return null;
  const secs = m * 60 + s;
  return secs < quarterLen() ? secs : null;
}

// ---------- rendering ----------
const colourDot = c => CSS.supports('color', c) ? c : '#888';
const quarterSel = $('#quarter');
for (let q = 1; q <= QUARTERS; q++) quarterSel.add(new Option('Q' + q, q));
quarterSel.addEventListener('change', () => {
  state.quarter = +quarterSel.value;
  save();
});

function scoreOf(team) {
  return state.goals.filter(g => g.team === team).length;
}

function renderHeader() {
  for (const side of ['left', 'right']) {
    const t = state.teams[side];
    const p = side === 'left' ? 'l' : 'r';
    $('#' + p + '-code').textContent = t.code;
    $('#' + p + '-dot').style.background = colourDot(t.colour);
    $('#' + p + '-score').textContent = scoreOf(side);
    $('#' + p + '-goal').innerHTML =
      `<span>GOAL</span><span>${esc(t.colour.toUpperCase())}</span><small>${esc(t.code.toUpperCase())}</small>`;
  }
  quarterSel.value = state.quarter;
}

function renderScorers() {
  const html = ['left', 'right'].map(side => {
    const counts = {};
    state.goals.filter(g => g.team === side).forEach(g => {
      const k = g.number === null ? 'no #' : '#' + g.number;
      counts[k] = (counts[k] || 0) + 1;
    });
    const parts = Object.entries(counts).map(([k, n]) => `${esc(k)}${n > 1 ? ' ×' + n : ''}`);
    return `<div style="margin-bottom:4px"><strong>${esc(state.teams[side].code)}</strong> ${parts.length ? parts.join(', ') : '<span class="sub">none yet</span>'}</div>`;
  });
  $('#scorers').innerHTML = html.join('');
}

function renderLog() {
  const sorted = [...state.goals].sort((a, b) => a.quarter - b.quarter || b.secs - a.secs);
  $('#log').innerHTML = sorted.length ? sorted.map(g => {
    const t = state.teams[g.team];
    const num = g.number === null ? 'no #' : '#' + g.number;
    return `<li>
      <span class="q">Q${g.quarter} · ${mmss(g.secs)}</span>
      <span class="who"><span class="dot" style="background:${colourDot(t.colour)};margin-right:6px"></span>${esc(t.code)} ${esc(num)}</span>
      <button data-del="${esc(g.id)}" class="ghost">Delete</button>
    </li>`;
  }).join('') : '<li class="empty">No goals yet.</li>';
  $('#undo').disabled = state.goals.length === 0;
}

function renderAll() {
  renderHeader();
  renderScorers();
  renderLog();
}

// ---------- goal entry ----------
const dlg = $('#goal-dialog');

const numIn = $('#g-number');
const timeIn = $('#g-time');

function openGoal(side) {
  $('#goal-form').dataset.team = side;
  $('#g-title').textContent = `${state.teams[side].colour} goal (${state.teams[side].code})`;
  numIn.value = '';
  timeIn.value = '';
  $('#g-time-preview').textContent = '';
  $('#g-error').textContent = '';
  $('#g-quarter-note').textContent = `Quarter ${state.quarter} (change it on the main page)`;
  dlg.showModal();
  setTimeout(() => numIn.focus(), 50);
}

$('#g-cancel').addEventListener('click', () => dlg.close());

// Digits only in both fields.
[numIn, timeIn].forEach(el => el.addEventListener('input', () => {
  el.value = el.value.replace(/\D/g, '');
}));

// Second player digit jumps to the time field.
numIn.addEventListener('input', () => {
  if (numIn.value.length === 2) timeIn.focus();
});

// Third time digit saves the goal straight away.
timeIn.addEventListener('input', () => {
  const secs = timeIn.value.length === 3 ? goalTimeSecs(timeIn.value) : null;
  $('#g-time-preview').textContent = timeIn.value.length === 3
    ? (secs === null ? 'Not a valid time' : 'Time ' + mmss(secs))
    : '';
  if (timeIn.value.length === 3) $('#goal-form').requestSubmit();
});

$('#goal-form').addEventListener('submit', ev => {
  ev.preventDefault();
  if (!/^\d{2}$/.test(numIn.value)) {
    $('#g-error').textContent = 'Player number must be 2 digits, e.g. 02.';
    numIn.focus();
    return;
  }
  const secs = goalTimeSecs(timeIn.value);
  if (secs === null) {
    $('#g-error').textContent = 'Time must be 3 digits m-ss, e.g. 432 for 4:32.';
    timeIn.focus();
    return;
  }
  state.goals.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    team: $('#goal-form').dataset.team,
    number: parseInt(numIn.value, 10),
    quarter: state.quarter,
    secs,
    created: Date.now()
  });
  save();
  dlg.close();
  renderAll();
});

// ---------- game controls ----------
$('#l-goal').addEventListener('click', () => openGoal('left'));
$('#r-goal').addEventListener('click', () => openGoal('right'));
$('#undo').addEventListener('click', () => {
  if (!state.goals.length) return;
  const last = state.goals.reduce((a, b) => (b.created > a.created ? b : a));
  if (!confirm(`Remove the last goal (Q${last.quarter} ${mmss(last.secs)})?`)) return;
  state.goals = state.goals.filter(g => g.id !== last.id);
  save();
  renderAll();
});
$('#log').addEventListener('click', ev => {
  const id = ev.target.dataset.del;
  if (!id) return;
  if (!confirm('Delete this goal?')) return;
  state.goals = state.goals.filter(g => g.id !== id);
  save();
  renderAll();
});
$('#new-game').addEventListener('click', () => {
  if (!confirm('Start a new game? All goals will be cleared and the quarter reset to 1.')) return;
  clearGame();
});
$('#reset-all').addEventListener('click', () => {
  if (!confirm('Clear all goals and reset the quarter to 1?')) return;
  clearGame();
});
function clearGame() {
  state.goals = [];
  state.quarter = 1;
  save();
  renderAll();
}

// ---------- settings ----------
function showSettings() {
  for (const side of ['left', 'right']) {
    const p = side === 'left' ? 's-l' : 's-r';
    $('#' + p + '-code').value = state.teams[side].code;
    $('#' + p + '-name').value = state.teams[side].name;
    $('#' + p + '-colour').value = state.teams[side].colour;
  }
  $('#s-quarter').value = state.quarterMinutes;
  $('#s-error').textContent = '';
}
$('#settings-form').addEventListener('submit', ev => {
  ev.preventDefault();
  const codes = ['s-l-code', 's-r-code'].map(id => $('#' + id).value.trim().toUpperCase());
  if (!codes.every(c => /^[A-Z0-9]{3}$/.test(c))) {
    $('#s-error').textContent = 'Country codes must be exactly 3 letters or digits (e.g. CAN).';
    return;
  }
  const qm = parseInt($('#s-quarter').value, 10);
  if (!(qm >= 1 && qm <= 30)) {
    $('#s-error').textContent = 'Minutes per quarter must be between 1 and 30.';
    return;
  }
  state.teams = {
    left:  { code: codes[0], name: $('#s-l-name').value.trim(), colour: $('#s-l-colour').value.trim() || 'Black' },
    right: { code: codes[1], name: $('#s-r-name').value.trim(), colour: $('#s-r-colour').value.trim() || 'White' }
  };
  state.quarterMinutes = qm;
  save();
  location.hash = '';
  renderAll();
});

// ---------- routing ----------
function route() {
  const onSettings = location.hash === '#settings';
  $('#game').hidden = onSettings;
  $('#settings-view').hidden = !onSettings;
  $('#nav').hidden = onSettings;
  if (onSettings) showSettings();
  else renderAll();
}
window.addEventListener('hashchange', route);
document.querySelector('a[href="#"]').addEventListener('click', ev => { ev.preventDefault(); location.hash = ''; });

route();
</script>
</body>
</html>
